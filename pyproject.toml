[project]
name = "co2"
version = "0.1.0"
description = "Prediction des emissions de CO2 des vehicules (donnees ADEME)"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["co2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
